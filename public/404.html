<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 金石篆刻社</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
        background: #faf6f0;
        color: #3b2a20;
      }
      .wrap {
        text-align: center;
        padding: 48px 24px;
      }
      .seal {
        width: 72px;
        height: 72px;
        margin: 0 auto 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 700;
        color: #fff;
        background: #c23a2b;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(194, 58, 43, 0.35);
      }
      h1 {
        font-size: 28px;
        letter-spacing: 8px;
        margin-bottom: 14px;
      }
      p {
        font-size: 15px;
        color: #8a7565;
        line-height: 1.8;
        margin-bottom: 34px;
      }
      a.btn {
        display: inline-block;
        padding: 11px 34px;
        font-size: 15px;
        letter-spacing: 4px;
        text-decoration: none;
        color: #fff;
        background: #3b2a20;
        border-radius: 6px;
        transition: background 0.2s;
      }
      a.btn:hover {
        background: #c23a2b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="seal">印</div>
      <h1>此页未刻</h1>
      <p>您访问的页面不存在或已被移动，请返回首页继续浏览。</p>
      <a class="btn" href="/">返回首页</a>
    </div>
  </body>
</html>
