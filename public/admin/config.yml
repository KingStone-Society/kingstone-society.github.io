# ============================================================
# 金石篆刻社 · Decap CMS 后台配置
# 作用：管理员在 /admin/ 登录后，在线创建 / 编辑 / 发布文章
# 发布 = 提交到 GitHub 仓库（触发 Actions 自动重新部署网站）
# 认证方式：DecapBridge（git-gateway）——与用户博客后台相同，
# 无需自建 OAuth 服务
# ============================================================

# ---------------- GitHub 后端认证 ----------------
# 使用 DecapBridge 托管的 git-gateway 认证服务。
# 首次使用：登录 https://decapbridge.com ，把本仓库
#   KingStone-Society/kingstone-society.github.io 注册为站点，
#   把生成的站点 ID 填入下方 identity_url 中。
backend:
  name: git-gateway
  repo: KingStone-Society/kingstone-society.github.io
  branch: main
  # DecapBridge 官网站点 ID（已在 https://decapbridge.com 注册）
  identity_url: https://auth.decapbridge.com/sites/fd6c8391-77ce-4b71-9b4f-85805c324f42
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://kingstone-society.github.io

# ---------------- 图片上传 ----------------
# 后台编辑器里上传的图片会提交到 public/images/articles/，
# 对应网站上的访问路径为 /images/articles/xxx
media_folder: 'public/images/articles'
public_folder: '/images/articles'

# ---------------- 文章管理 ----------------
collections:
  - name: articles
    label: 文章
    folder: src/articles
    create: true
    delete: true
    # 新文章文件名：日期 + 访问标识，如 2026-08-18-我的新文章.md
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: ['date', 'title']
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '副标题', name: 'subtitle', widget: 'string', required: false }
      - label: '日期'
        name: 'date'
        widget: 'datetime'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm:ss'
      - { label: '作者', name: 'author', widget: 'string' }
      - { label: '访问标识 (slug)', name: 'slug', widget: 'string', hint: '文章网址为 /article/访问标识，建议用英文与短横线，如 my-article' }
      - { label: '封面图', name: 'header-img', widget: 'image', required: false, hint: '图片上传后自动填入 /images/articles/ 路径' }
      - { label: '标签', name: 'tags', widget: 'list', required: false, hint: '如：社团、管理、文学' }
      - { label: '板块', name: 'section', widget: 'list', required: false, hint: '第一项为一级板块，第二项为二级板块，如：社务研讨 / 研讨文集' }
      - { label: '正文', name: 'body', widget: 'markdown', hint: '{XXX} 表示居中，→XXX 表示靠右；单独一行写入图片路径可插入图片' }
