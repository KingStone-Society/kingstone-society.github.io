<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>金石篆刻社 · 管理后台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
        background: #faf6f0;
        color: #3b2a20;
      }
      /* ===== 登录页 ===== */
      #login-panel {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        width: 360px;
        max-width: 100%;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(59, 42, 32, 0.12);
        padding: 40px 36px 32px;
        text-align: center;
      }
      .seal {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        background: #c23a2b;
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(194, 58, 43, 0.35);
      }
      .login-card h1 {
        font-size: 20px;
        letter-spacing: 4px;
        margin-bottom: 6px;
      }
      .login-card .sub {
        font-size: 13px;
        color: #8a7565;
        margin-bottom: 26px;
        letter-spacing: 2px;
      }
      .field {
        margin-bottom: 16px;
        text-align: left;
      }
      .field label {
        display: block;
        font-size: 13px;
        color: #8a7565;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }
      .field input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        font-size: 14px;
        color: #3b2a20;
        background: #faf6f0;
        border: 1px solid #e3d8cb;
        border-radius: 6px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .field input:focus {
        border-color: #c23a2b;
      }
      .btn-login {
        width: 100%;
        height: 42px;
        margin-top: 8px;
        font-size: 15px;
        letter-spacing: 6px;
        color: #fff;
        background: #c23a2b;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s;
      }
      .btn-login:hover {
        background: #a52e20;
      }
      .error {
        display: none;
        margin-top: 14px;
        font-size: 13px;
        color: #c23a2b;
      }
      .back-link {
        display: inline-block;
        margin-top: 18px;
        font-size: 13px;
        color: #8a7565;
        text-decoration: none;
      }
      .back-link:hover {
        color: #c23a2b;
      }
      /* ===== Decap CMS 挂载 ===== */
      /* 注意：Decap CMS 挂载在 body 底部的 #nc-root 中，#cms-panel 只放顶部条，
         不能设 min-height，否则会留下一整屏空白把 Decap 内容挤到下面 */
      #cms-panel {
        display: none;
      }
      .cms-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: #3b2a20;
        color: #fff;
        font-size: 14px;
        letter-spacing: 2px;
      }
      .cms-topbar a {
        color: #f0d9c0;
        text-decoration: none;
        margin-left: 16px;
        font-size: 13px;
      }
      .cms-topbar a:hover {
        color: #fff;
      }
      .cms-loading {
        padding: 60px 20px;
        text-align: center;
        color: #8a7565;
        font-size: 14px;
        letter-spacing: 2px;
      }
      .cms-loading::before {
        content: '';
        display: block;
        width: 28px;
        height: 28px;
        margin: 0 auto 18px;
        border: 3px solid #e3d8cb;
        border-top-color: #c23a2b;
        border-radius: 50%;
        animation: cms-spin 1s linear infinite;
      }
      @keyframes cms-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cms-loading-tip {
        margin-top: 10px;
        font-size: 12px;
        color: #b09a86;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <!-- 登录门禁 -->
    <div id="login-panel">
      <div class="login-card">
        <div class="seal">印</div>
        <h1>管理后台</h1>
        <p class="sub">金石篆刻社</p>
        <form id="login-form" autocomplete="off">
          <div class="field">
            <label for="username">管理员账号</label>
            <input id="username" name="username" type="text" maxlength="20" placeholder="请输入账号" />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" maxlength="50" placeholder="请输入密码" />
          </div>
          <button class="btn-login" type="submit">登 录</button>
          <p class="error" id="login-error">账号或密码错误</p>
        </form>
        <a class="back-link" href="/">← 返回首页</a>
      </div>
    </div>

    <!-- Decap CMS 后台 -->
    <div id="cms-panel">
      <div class="cms-topbar">
        <span>金石篆刻社 · 文章管理</span>
        <span>
          <a href="/" target="_blank">查看网站</a>
          <a href="#" id="logout-btn">退出登录</a>
        </span>
      </div>
      <div class="cms-loading" id="cms-loading">
        <div>正在加载编辑后台…</div>
        <div class="cms-loading-tip">首次加载需下载约 1.5MB 组件，预计 10~30 秒，请耐心等待；超过 1 分钟请刷新重试</div>
      </div>
    </div>

    <script>
      // ===== 管理员账号配置 =====
      // 账号：0101
      // 密码：qq1211234（下方只存 SHA-256 摘要，避免明文直接出现在页面源码中）
      // 注意：静态网页的登录校验仅作为"门禁"，无法做到绝对安全，
      //       真正的内容写入权限由下方 Decap 的 GitHub 授权控制。
      var ADMIN = {
        username: '0101',
        passwordHash: '96baa347160a890820d3ce8cbd6d59d61c550f5cb68d9224fd0f5daf50fa231e'
      };
      var SESSION_KEY = 'ks_admin_logged_in';

      function sha256Hex(text) {
        var data = new TextEncoder().encode(text);
        return crypto.subtle.digest('SHA-256', data).then(function (buf) {
          return Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('');
        });
      }

      // 退出登录：清除登录标记并刷新
      document.getElementById('logout-btn').addEventListener('click', function (e) {
        e.preventDefault();
        sessionStorage.removeItem(SESSION_KEY);
        location.reload();
      });

      // 登录校验
      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var errorEl = document.getElementById('login-error');

        sha256Hex(password).then(function (hash) {
          if (username === ADMIN.username && hash === ADMIN.passwordHash) {
            errorEl.style.display = 'none';
            sessionStorage.setItem(SESSION_KEY, '1');
            enterAdmin();
          } else {
            errorEl.style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
          }
        });
      });

      // 动态加载 Decap CMS（优先本地文件 decap-cms.js，失败回退 CDN）
      function loadDecap() {
        return new Promise(function (resolve, reject) {
          var srcs = [
            '/admin/decap-cms.js',
            'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js',
            'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js'
          ];
          function tryLoad(i) {
            if (i >= srcs.length) return reject(new Error('Decap CMS 加载失败'));
            var s = document.createElement('script');
            s.src = srcs[i];
            s.async = true;
            s.onload = resolve;
            s.onerror = function () { tryLoad(i + 1); };
            document.head.appendChild(s);
          }
          tryLoad(0);
        });
      }

      // 进入后台
      function enterAdmin() {
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('cms-panel').style.display = 'block';
        document.getElementById('cms-loading').style.display = 'block';

        loadDecap().then(function () {
          document.getElementById('cms-loading').style.display = 'none';
        }).catch(function (err) {
          document.getElementById('cms-loading').textContent = '加载编辑后台失败（本地与两个 CDN 均不可用），请检查网络后刷新重试。';
          console.error(err);
        });
      }

      // 已登录则直接进入后台
      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        enterAdmin();
      }
    </script>
  </body>
</html>
